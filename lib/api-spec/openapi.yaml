openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /stripe/test-status:
    get:
      operationId: getStripeTestStatus
      responses:
        "200":
          description: Test checkout readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeTestStatus"
  /stripe/payment-intent:
    post:
      operationId: createTestPaymentIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntentInput"
      responses:
        "201":
          description: Test-mode PaymentIntent for the embedded card form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentConfig"
        "400":
          description: Invalid cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "503":
          description: Payment not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /stripe/payment-verification:
    post:
      operationId: verifyTestPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentVerificationInput"
      responses:
        "200":
          description: Verified test-mode PaymentIntent state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentVerification"
        "403":
          description: PaymentIntent is not owned by this browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "503":
          description: Unable to verify payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /openai/invoice-analysis:
    post:
      operationId: analyzeInvoice
      tags: [invoices]
      summary: Extract invoice text and verify arithmetic without storing it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceTextInput"
      responses:
        "200":
          description: Extracted values and deterministic arithmetic checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceAnalysis"
        "400":
          description: Invalid input or not an invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "429":
          description: Request limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "502":
          description: Invalid provider response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "503":
          description: Analysis temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "504":
          description: Analysis timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /openai/invoice-file-analysis:
    post:
      operationId: analyzeInvoiceFile
      tags: [invoices]
      summary: Analyze an invoice image or PDF without storing it
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/InvoiceFileInput"
      responses:
        "200":
          description: Extracted values and arithmetic checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceAnalysis"
        "400":
          description: Unsupported file, missing consent or unrecognized invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "413":
          description: File or PDF exceeds safe processing limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "429":
          description: Request limit or analysis capacity reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "502":
          description: Provider or extraction failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "503":
          description: Analysis temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
        "504":
          description: Analysis timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    StripeTestStatus:
      type: object
      required: [ready, testMode, message, publishableKey, checkoutCurrency, exchangeRateUpdatedAt, exchangeRateSource]
      properties:
        ready: { type: boolean }
        testMode: { type: boolean, enum: [true] }
        message: { type: string }
        publishableKey: { type: ["string", "null"] }
        checkoutCurrency: { type: ["string", "null"], enum: [kwd, usd, null] }
        exchangeRateUpdatedAt: { type: ["string", "null"], format: date-time }
        exchangeRateSource: { type: ["string", "null"], format: uri }
    PaymentIntentInput:
      type: object
      additionalProperties: false
      required: [planIds, requestId]
      properties:
        planIds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: [small-restaurant, growth, chain] }
        requestId: { type: string, format: uuid }
    PaymentIntentConfig:
      type: object
      required: [clientSecret, paymentIntentId, amountKwdFils, checkoutCurrency, exchangeRateUpdatedAt, testMode]
      properties:
        clientSecret: { type: string }
        paymentIntentId: { type: string, pattern: '^pi_[A-Za-z0-9]+$', maxLength: 255 }
        amountKwdFils: { type: integer, minimum: 1 }
        checkoutCurrency: { type: string, enum: [kwd, usd] }
        exchangeRateUpdatedAt: { type: ["string", "null"], format: date-time }
        testMode: { type: boolean, enum: [true] }
    PaymentVerificationInput:
      type: object
      additionalProperties: false
      required: [paymentIntentId]
      properties:
        paymentIntentId: { type: string, pattern: '^pi_[A-Za-z0-9]+$', maxLength: 255 }
    PaymentVerification:
      type: object
      required: [status, testMode, message, planIds]
      properties:
        status: { type: string, enum: [paid, pending, failed] }
        testMode: { type: boolean, enum: [true] }
        message: { type: string }
        planIds:
          type: array
          items: { type: string, enum: [small-restaurant, growth, chain] }
    InvoiceTextInput:
      type: object
      additionalProperties: false
      required: [text, consent]
      properties:
        text:
          type: string
          minLength: 10
          maxLength: 12000
        consent:
          type: boolean
          enum: [true]
    InvoiceFileInput:
      type: object
      additionalProperties: false
      required: [file, consent]
      properties:
        file: { type: string, format: binary, description: One JPEG, PNG, WebP image, or PDF up to 8 MB }
        consent: { type: boolean, enum: [true] }
    AnalysisError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    InvoiceDecimal:
      type: [string, "null"]
      description: Exact nonnegative decimal string from invoice; null if missing or ambiguous
      pattern: '^\d{1,12}(\.\d{1,6})?$'
    InvoiceLine:
      type: object
      additionalProperties: false
      required: [description, quantity, unitPrice, lineTotal, discountAmount, taxAmount]
      properties:
        description: { type: string, maxLength: 200 }
        quantity: { $ref: "#/components/schemas/InvoiceDecimal" }
        unitPrice: { $ref: "#/components/schemas/InvoiceDecimal" }
        lineTotal: { $ref: "#/components/schemas/InvoiceDecimal" }
        discountAmount: { $ref: "#/components/schemas/InvoiceDecimal" }
        taxAmount: { $ref: "#/components/schemas/InvoiceDecimal" }
    InvoiceExtraction:
      type: object
      additionalProperties: false
      required: [isInvoice, currency, items, subtotal, discountAmount, discountRate, taxAmount, taxRate, additionalCharges, total, taxIncluded, unsupportedAdjustments, sourceReviewRequired, notes]
      properties:
        isInvoice: { type: boolean }
        currency: { type: [string, "null"], maxLength: 30 }
        items:
          type: array
          maxItems: 60
          items: { $ref: "#/components/schemas/InvoiceLine" }
        subtotal: { $ref: "#/components/schemas/InvoiceDecimal" }
        discountAmount: { $ref: "#/components/schemas/InvoiceDecimal" }
        discountRate: { $ref: "#/components/schemas/InvoiceDecimal" }
        taxAmount: { $ref: "#/components/schemas/InvoiceDecimal" }
        taxRate: { $ref: "#/components/schemas/InvoiceDecimal" }
        additionalCharges: { $ref: "#/components/schemas/InvoiceDecimal" }
        total: { $ref: "#/components/schemas/InvoiceDecimal" }
        taxIncluded: { type: [boolean, "null"] }
        unsupportedAdjustments: { type: boolean }
        sourceReviewRequired: { type: boolean }
        notes:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 300 }
    ArithmeticCheck:
      type: object
      required: [label, stated, calculated, difference, status]
      properties:
        label: { type: string }
        stated: { $ref: "#/components/schemas/InvoiceDecimal" }
        calculated: { type: [string, "null"] }
        difference: { type: [string, "null"] }
        status: { type: string, enum: [match, mismatch, unverified] }
    InvoiceAnalysis:
      type: object
      required: [invoice, itemChecks, checks, warnings, status, roundingNote]
      properties:
        invoice: { $ref: "#/components/schemas/InvoiceExtraction" }
        itemChecks:
          type: array
          items: { $ref: "#/components/schemas/ArithmeticCheck" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/ArithmeticCheck" }
        warnings:
          type: array
          items: { type: string }
        status: { type: string, enum: [match, mismatch, unverified] }
        roundingNote: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

